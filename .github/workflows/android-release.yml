name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version info
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # 规范化 Tag 均以 v 开头
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VER="${TAG#v}"
          # 计算语义化 versionCode（major*10000 + minor*100 + patch），无法解析时回退 run_number
          IFS='.-' read -r MAJOR MINOR PATCH _ <<< "$VER"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && [[ "$MINOR" =~ ^[0-9]+$ ]] && [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            CODE="${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG versionName=$VER versionCode=$CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Please configure signing secrets in Repository Settings."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
          ls -lh "${{ runner.temp }}/release.jks"

      - name: Run unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          APK_NAME="ryan-calendar-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryan-calendar-${{ steps.version.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 工作日程 Android ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
